<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>

<body>

<header class="header">

    <a
        href="/"
        class="logo"
    >

        <span class="logo-box">
            F
        </span>

        FitBuddy

    </a>

    <nav>

        <a href="/">
            Create Plan
        </a>

        <a href="/view-all-users">
            Users
        </a>

        <a href="/docs">
            API
        </a>

    </nav>

</header>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer>

    <p>
        FitBuddy — AI Fitness Plan Generator
    </p>

    <small>
        General wellness guidance only. Not medical advice.
    </small>

</footer>


<script
    src="{{ url_for('static', path='app.js') }}"
></script>

</body>

</html>
